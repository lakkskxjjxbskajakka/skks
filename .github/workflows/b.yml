
name: LarpCode Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  larpcode:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install LarpCode CLI
        shell: pwsh
        run: |
          irm https://github.com/Tazmyan/LarpCode/releases/latest/download/install-cli.ps1 | iex

      - name: Install Cloudflared
        shell: pwsh
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          $path = "$env:RUNNER_TEMP\cloudflared.exe"

          Invoke-WebRequest -Uri $url -OutFile $path

          if (!(Test-Path $path)) {
              throw "Cloudflared installation failed."
          }

          Write-Host "Cloudflared installed successfully."

      - name: Run LarpCode + Cloudflare Tunnel (355 Minutes)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $larpcode = "$env:LOCALAPPDATA\Programs\LarpCode CLI\bin\larpcode.exe"
          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"

          $server = $null
          $tunnel = $null

          $serverOut = "$env:RUNNER_TEMP\larpcode-out.log"
          $serverErr = "$env:RUNNER_TEMP\larpcode-err.log"
          $tunnelOut = "$env:RUNNER_TEMP\tunnel-out.log"
          $tunnelErr = "$env:RUNNER_TEMP\tunnel-err.log"

          function Test-TcpPort {
              param(
                  [string]$HostName,
                  [int]$Port
              )

              $client = [System.Net.Sockets.TcpClient]::new()

              try {
                  $async = $client.BeginConnect(
                      $HostName,
                      $Port,
                      $null,
                      $null
                  )

                  if (!$async.AsyncWaitHandle.WaitOne(1000)) {
                      return $false
                  }

                  $client.EndConnect($async)
                  return $true
              }
              catch {
                  return $false
              }
              finally {
                  $client.Dispose()
              }
          }

          try {
              # Start LarpCode
              Write-Host "Starting LarpCode..."

              $server = Start-Process `
                  -FilePath $larpcode `
                  -ArgumentList @(
                      "serve",
                      "--hostname", "127.0.0.1",
                      "--port", "3000"
                  ) `
                  -PassThru `
                  -NoNewWindow `
                  -RedirectStandardOutput $serverOut `
                  -RedirectStandardError $serverErr

              # Wait for server
              $ready = $false

              for ($i = 0; $i -lt 60; $i++) {
                  $server.Refresh()

                  if ($server.HasExited) {
                      throw "LarpCode process exited."
                  }

                  if (Test-TcpPort "127.0.0.1" 3000) {
                      $ready = $true
                      break
                  }

                  Start-Sleep -Seconds 2
              }

              if (!$ready) {
                  Write-Host "LarpCode logs:"
                  Get-Content $serverErr -ErrorAction SilentlyContinue
                  throw "LarpCode server failed to start."
              }

              Write-Host "LarpCode is ONLINE!"

              # Start Cloudflare Tunnel
              Write-Host "Starting Cloudflare Tunnel..."

              $tunnel = Start-Process `
                  -FilePath $cloudflared `
                  -ArgumentList @(
                      "tunnel",
                      "--url", "http://127.0.0.1:3000",
                      "--no-autoupdate"
                  ) `
                  -PassThru `
                  -NoNewWindow `
                  -RedirectStandardOutput $tunnelOut `
                  -RedirectStandardError $tunnelErr

              # Wait for public URL
              $publicUrl = $null

              for ($i = 0; $i -lt 90; $i++) {
                  $tunnel.Refresh()

                  if ($tunnel.HasExited) {
                      Get-Content $tunnelErr -ErrorAction SilentlyContinue
                      throw "Cloudflare Tunnel exited unexpectedly."
                  }

                  $logs = @(
                      Get-Content $tunnelOut -ErrorAction SilentlyContinue
                      Get-Content $tunnelErr -ErrorAction SilentlyContinue
                  )

                  foreach ($line in $logs) {
                      if ($line -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                          $publicUrl = $Matches[0]
                          break
                      }
                  }

                  if ($publicUrl) {
                      break
                  }

                  Start-Sleep -Seconds 2
              }

              if (!$publicUrl) {
                  Get-Content $tunnelErr -ErrorAction SilentlyContinue
                  throw "Could not obtain Cloudflare URL."
              }

              # Display public URL
              Write-Host ""
              Write-Host "=========================================="
              Write-Host "       LARPCODE PUBLIC SERVER"
              Write-Host "=========================================="
              Write-Host $publicUrl
              Write-Host "=========================================="

              @"
              ## LarpCode Public Server

              **URL:** $publicUrl

              **Duration:** 355 minutes

              **Status:** ONLINE
              "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append

              # Keep both processes alive
              Write-Host ""
              Write-Host "Keeping services alive for 355 minutes..."

              $end = (Get-Date).AddMinutes(355)
              $failedChecks = 0

              while ((Get-Date) -lt $end) {

                  $server.Refresh()
                  $tunnel.Refresh()

                  if ($tunnel.HasExited) {
                      Get-Content $tunnelErr -ErrorAction SilentlyContinue
                      throw "Cloudflare Tunnel stopped!"
                  }

                  if ($server.HasExited) {
                      throw "LarpCode process stopped!"
                  }

                  if (Test-TcpPort "127.0.0.1" 3000) {
                      $failedChecks = 0
                      $serverStatus = "ONLINE"
                  }
                  else {
                      $failedChecks++
                      $serverStatus = "OFFLINE"

                      if ($failedChecks -ge 3) {
                          throw "LarpCode server is unreachable."
                      }
                  }

                  $remaining = [math]::Ceiling(
                      ($end - (Get-Date)).TotalMinutes
                  )

                  Write-Host "LarpCode: $serverStatus | Cloudflare: ONLINE | Remaining: $remaining minutes"

                  Start-Sleep -Seconds 30
              }

              Write-Host ""
              Write-Host "355 MINUTES COMPLETED SUCCESSFULLY!"

          }
          finally {
              # Cleanup
              Write-Host "Stopping services..."

              foreach ($process in @($tunnel, $server)) {
                  if ($null -ne $process) {
                      $process.Refresh()

                      if (!$process.HasExited) {
                          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                          Write-Host "Stopped PID: $($process.Id)"
                      }
                  }
              }

              Write-Host "Cleanup completed."
          }
