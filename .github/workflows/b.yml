
name: LarpCode Windows Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  larpcode:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      OPENCODE_PASSWORD: Amir123456
      OPENCODE_SERVER_PASSWORD: Amir123456

    steps:
      - name: Install LarpCode
        shell: pwsh
        run: |
          irm https://github.com/Tazmyan/LarpCode/releases/latest/download/install-cli.ps1 | iex

          $larpcode = "$env:LOCALAPPDATA\Programs\LarpCode CLI\bin\larpcode.exe"

          if (!(Test-Path $larpcode)) {
            throw "LarpCode executable not found"
          }

          "LARPCODE_EXE=$larpcode" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          & $larpcode --version

      - name: Install Cloudflare Tunnel
        shell: pwsh
        run: |
          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "Cloudflared installation failed"
          }

          "CLOUDFLARED_EXE=$cloudflared" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          & $cloudflared --version

      - name: Configure LarpCode
        shell: pwsh
        run: |
          $larpcode = $env:LARPCODE_EXE

          & $larpcode service set hostname 127.0.0.1
          & $larpcode service set port 3000
          & $larpcode service set password $env:OPENCODE_PASSWORD

          if ($LASTEXITCODE -ne 0) {
            throw "LarpCode configuration failed"
          }

      - name: Start LarpCode Server
        shell: pwsh
        run: |
          $larpcode = $env:LARPCODE_EXE

          $serverLog = "$env:RUNNER_TEMP\larpcode-server.log"
          $serverError = "$env:RUNNER_TEMP\larpcode-server-error.log"

          $server = Start-Process `
            -FilePath $larpcode `
            -ArgumentList @("serve", "--service") `
            -PassThru `
            -RedirectStandardOutput $serverLog `
            -RedirectStandardError $serverError

          "LARPCODE_PID=$($server.Id)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          $ready = $false

          for ($i = 0; $i -lt 60; $i++) {
            if ($server.HasExited) {
              Get-Content $serverError -ErrorAction SilentlyContinue
              throw "LarpCode server exited unexpectedly"
            }

            $tcp = New-Object System.Net.Sockets.TcpClient

            try {
              $task = $tcp.ConnectAsync("127.0.0.1", 3000)

              if ($task.Wait(1000) -and $tcp.Connected) {
                $ready = $true
                break
              }
            }
            catch {
            }
            finally {
              $tcp.Dispose()
            }

            Start-Sleep -Seconds 2
          }

          if (!$ready) {
            throw "LarpCode server did not become ready"
          }

          Write-Host "LarpCode is listening on port 3000"

      - name: Start Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $cloudflared = $env:CLOUDFLARED_EXE

          $stdout = "$env:RUNNER_TEMP\cloudflare.log"
          $stderr = "$env:RUNNER_TEMP\cloudflare-error.log"

          $tunnel = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:3000",
              "--no-autoupdate"
            ) `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr

          "CLOUDFLARE_PID=$($tunnel.Id)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          $tunnelUrl = $null

          for ($i = 0; $i -lt 60; $i++) {
            if ($tunnel.HasExited) {
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Cloudflare Tunnel exited unexpectedly"
            }

            $logs = ""

            if (Test-Path $stderr) {
              $logs += Get-Content $stderr -Raw
            }

            if (Test-Path $stdout) {
              $logs += Get-Content $stdout -Raw
            }

            $match = [regex]::Match(
              $logs,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $tunnelUrl = $match.Value
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$tunnelUrl) {
            throw "Could not obtain Cloudflare Tunnel URL"
          }

          "TUNNEL_URL=$tunnelUrl" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Cloudflare Tunnel is ready: $tunnelUrl"

      - name: Generate Browser Pairing Link
        shell: pwsh
        run: |
          $larpcode = $env:LARPCODE_EXE
          $url = $env:TUNNEL_URL

          Write-Host "Generating LarpCode pairing link..."

          $output = & $larpcode pair --url $url 2>&1

          if ($LASTEXITCODE -ne 0) {
            $output
            throw "Pairing link generation failed"
          }

          $output | ForEach-Object {
            Write-Host $_
          }

          Write-Host ""
          Write-Host "Open the generated pairing link in your browser."

      - name: Keep Server Alive
        shell: pwsh
        run: |
          $serverPid = [int]$env:LARPCODE_PID
          $tunnelPid = [int]$env:CLOUDFLARE_PID

          $deadline = (Get-Date).AddMinutes(355)

          Write-Host "LarpCode hosting started."
          Write-Host "Hosting duration: 355 minutes."

          while ((Get-Date) -lt $deadline) {
            $server = Get-Process -Id $serverPid -ErrorAction SilentlyContinue
            $tunnel = Get-Process -Id $tunnelPid -ErrorAction SilentlyContinue

            if (!$server) {
              throw "LarpCode server stopped unexpectedly"
            }

            if (!$tunnel) {
              throw "Cloudflare Tunnel stopped unexpectedly"
            }

            $remaining = [int]($deadline - (Get-Date)).TotalMinutes

            Write-Host "Server running. Remaining: $remaining minutes"

            Start-Sleep -Seconds 60
          }

          Write-Host "355-minute hosting period completed."

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("LARPCODE_PID", "CLOUDFLARE_PID")) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ($value) {
              Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue
            }
          }
