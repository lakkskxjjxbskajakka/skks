
name: LarpCode CLI Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  install-and-test:
    runs-on: windows-latest

    steps:
      - name: Install LarpCode CLI
        shell: pwsh
        run: |
          irm https://github.com/Tazmyan/LarpCode/releases/latest/download/install-cli.ps1 | iex
      - name: Inspect LarpCode Serve
        shell: pwsh
        run: |
          $larpcode = "$env:LOCALAPPDATA\Programs\LarpCode CLI\bin\larpcode.exe"
          & $larpcode serve --help
      - name: Run LarpCode Help
        shell: pwsh
        run: |
          $larpcode = "$env:LOCALAPPDATA\Programs\LarpCode CLI\bin\larpcode.exe"

          if (!(Test-Path $larpcode)) {
              throw "LarpCode executable not found: $larpcode"
          }

          & $larpcode --help

