
name: LarpCode Windows Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      OPENCODE_PASSWORD: Amir123456
      OPENCODE_SERVER_PASSWORD: Amir123456

    steps:
      - name: Install, Launch and Monitor LarpCode + Cloudflare
        timeout-minutes: 360
        shell: bash
        run: |
          python -u - <<'PY'
          import os
          import sys
          import re
          import time
          import socket
          import shutil
          import urllib.request
          import subprocess
          from pathlib import Path
          from datetime import datetime

          # ==========================================
          # Configuration
          # ==========================================

          PORT = 3000
          HOST = "127.0.0.1"
          DURATION = 355 * 60

          PASSWORD = os.environ["OPENCODE_PASSWORD"]

          WORK = Path(os.environ["RUNNER_TEMP"]) / "larpcode"
          WORK.mkdir(parents=True, exist_ok=True)

          SERVER_LOG = WORK / "larpcode.log"
          TUNNEL_LOG = WORK / "cloudflared.log"

          server_process = None
          tunnel_process = None
          tunnel_log_handle = None

          # ==========================================
          # Utilities
          # ==========================================

          def log(message):
              now = datetime.now().strftime("%H:%M:%S")
              print(f"[{now}] {message}", flush=True)

          def run_command(args, **kwargs):
              return subprocess.run(
                  args,
                  check=True,
                  **kwargs
              )

          def download(url, destination):
              log(f"Downloading: {url}")

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:
                  destination.write_bytes(response.read())

          def port_is_open():
              try:
                  with socket.create_connection(
                      (HOST, PORT),
                      timeout=3
                  ):
                      return True
              except OSError:
                  return False

          def wait_for_server(timeout=120):
              deadline = time.time() + timeout

              while time.time() < deadline:
                  if port_is_open():
                      return True
                  time.sleep(2)

              return False

          # ==========================================
          # Install LarpCode
          # ==========================================

          try:
              log("Installing LarpCode...")

              installer = WORK / "install-cli.ps1"

              download(
                  "https://github.com/Tazmyan/LarpCode/releases/latest/download/install-cli.ps1",
                  installer
              )

              powershell = shutil.which("powershell.exe")

              if not powershell:
                  raise RuntimeError("PowerShell not found")

              run_command([
                  powershell,
                  "-NoProfile",
                  "-ExecutionPolicy", "Bypass",
                  "-File", str(installer)
              ])

              larpcode = (
                  Path(os.environ["LOCALAPPDATA"])
                  / "Programs"
                  / "LarpCode CLI"
                  / "bin"
                  / "larpcode.exe"
              )

              if not larpcode.exists():
                  found = shutil.which("larpcode")
                  if found:
                      larpcode = Path(found)
                  else:
                      raise RuntimeError(
                          "LarpCode executable not found"
                      )

              log(f"LarpCode installed: {larpcode}")

              # ======================================
              # Configure LarpCode
              # ======================================

              log("Configuring LarpCode service...")

              for setting in [
                  ["service", "set", "hostname", HOST],
                  ["service", "set", "port", str(PORT)],
                  ["service", "set", "password", PASSWORD],
              ]:
                  run_command([
                      str(larpcode),
                      *setting
                  ])

              # ======================================
              # Start LarpCode
              # ======================================

              def start_server():
                  global server_process

                  log("Starting LarpCode service...")

                  server_file = open(
                      SERVER_LOG,
                      "a",
                      encoding="utf-8"
                  )

                  server_process = subprocess.Popen(
                      [
                          str(larpcode),
                          "serve",
                          "--service"
                      ],
                      stdout=server_file,
                      stderr=subprocess.STDOUT,
                      creationflags=subprocess.CREATE_NO_WINDOW
                  )

                  server_file.close()

              start_server()

              if not wait_for_server(120):
                  raise RuntimeError(
                      "LarpCode failed to start on port 3000"
                  )

              log("LarpCode is ONLINE.")

              # ======================================
              # Install Cloudflared
              # ======================================

              cloudflared = WORK / "cloudflared.exe"

              download(
                  "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe",
                  cloudflared
              )

              log("Cloudflared installed.")

              # ======================================
              # Start Cloudflare Quick Tunnel
              # ======================================

              def start_tunnel():
                  global tunnel_process
                  global tunnel_log_handle

                  log("Starting Cloudflare Quick Tunnel...")

                  tunnel_log_handle = open(
                      TUNNEL_LOG,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  )

                  tunnel_process = subprocess.Popen(
                      [
                          str(cloudflared),
                          "tunnel",
                          "--url",
                          f"http://{HOST}:{PORT}",
                          "--no-autoupdate"
                      ],
                      stdout=tunnel_log_handle,
                      stderr=subprocess.STDOUT,
                      creationflags=subprocess.CREATE_NO_WINDOW
                  )

                  deadline = time.time() + 120

                  while time.time() < deadline:

                      if tunnel_process.poll() is not None:
                          raise RuntimeError(
                              "Cloudflare Tunnel exited during startup"
                          )

                      tunnel_log_handle.flush()

                      try:
                          content = TUNNEL_LOG.read_text(
                              encoding="utf-8",
                              errors="replace"
                          )

                          match = re.search(
                              r"https://[a-zA-Z0-9-]+\.trycloudflare\.com",
                              content
                          )

                          if match:
                              return match.group(0)

                      except OSError:
                          pass

                      time.sleep(2)

                  raise RuntimeError(
                      "Cloudflare Tunnel URL was not found"
                  )

              # ======================================
              # Pairing
              # ======================================

              def create_pairing(url):
                  log("Generating browser pairing link...")

                  result = subprocess.run(
                      [
                          str(larpcode),
                          "pair",
                          "--url",
                          url
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                      timeout=90
                  )

                  print(result.stdout, flush=True)

                  if result.returncode != 0:
                      raise RuntimeError(
                          "Pairing command failed"
                      )

              tunnel_url = start_tunnel()

              log("=" * 55)
              log("CLOUDFLARE TUNNEL READY")
              log(tunnel_url)
              log("=" * 55)

              create_pairing(tunnel_url)

              # ======================================
              # Hosting Monitor
              # ======================================

              log("LarpCode hosting started.")
              log("Hosting duration: 355 minutes.")

              deadline = time.time() + DURATION

              while time.time() < deadline:

                  # Check LarpCode TCP port
                  if not port_is_open():

                      log("WARNING: LarpCode is offline.")
                      log("Attempting to restart LarpCode...")

                      start_server()

                      if not wait_for_server(90):
                          raise RuntimeError(
                              "LarpCode could not be restarted"
                          )

                      log("LarpCode recovered.")

                  # Check Cloudflare Tunnel
                  if tunnel_process.poll() is not None:

                      log("WARNING: Cloudflare Tunnel stopped.")
                      log("Restarting tunnel...")

                      tunnel_url = start_tunnel()

                      log("=" * 55)
                      log("NEW CLOUDFLARE TUNNEL URL")
                      log(tunnel_url)
                      log("=" * 55)

                      create_pairing(tunnel_url)

                      log("New tunnel and pairing are ready.")

                  remaining = int(
                      (deadline - time.time()) / 60
                  )

                  log(
                      f"LarpCode: ONLINE | "
                      f"Cloudflare: ONLINE | "
                      f"Remaining: {remaining} minutes"
                  )

                  time.sleep(60)

              log("355-minute hosting period completed.")

          except Exception as error:
              log(f"FATAL ERROR: {error}")
              raise

          finally:
              log("Cleaning up processes...")

              for process in [
                  tunnel_process,
                  server_process
              ]:

                  if process is not None:
                      try:
                          subprocess.run(
                              [
                                  "taskkill",
                                  "/PID",
                                  str(process.pid),
                                  "/T",
                                  "/F"
                              ],
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                              timeout=15
                          )
                      except Exception:
                          pass

              if tunnel_log_handle:
                  try:
                      tunnel_log_handle.close()
                  except Exception:
                      pass

              log("Cleanup completed.")
          PY
