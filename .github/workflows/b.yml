
name: LarpCode Windows Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      OPENCODE_PASSWORD: Amir123456
      OPENCODE_SERVER_PASSWORD: Amir123456

    steps:

      - name: Install LarpCode
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\install-cli.ps1"

          Invoke-WebRequest `
            "https://github.com/Tazmyan/LarpCode/releases/latest/download/install-cli.ps1" `
            -OutFile $installer

          & $installer

          $larpcode = "$env:LOCALAPPDATA\Programs\LarpCode CLI\bin\larpcode.exe"

          if (!(Test-Path $larpcode)) {
            throw "LarpCode installation failed"
          }

          "LARPCODE_EXE=$larpcode" >> $env:GITHUB_ENV

      - name: Install Cloudflared
        shell: pwsh
        run: |
          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "Cloudflared installation failed"
          }

          "CLOUDFLARED_EXE=$cloudflared" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run LarpCode and Cloudflare
        timeout-minutes: 356
        shell: pwsh
        run: |
          @'
          import os
          import re
          import time
          import socket
          import subprocess
          from pathlib import Path
          from datetime import datetime

          HOST = "127.0.0.1"
          PORT = 3000
          DURATION = 355 * 60

          LARPCODE = Path(os.environ["LARPCODE_EXE"])
          CLOUDFLARED = Path(os.environ["CLOUDFLARED_EXE"])
          PASSWORD = os.environ["OPENCODE_PASSWORD"]

          WORK = Path(os.environ["RUNNER_TEMP"]) / "larpcode"
          WORK.mkdir(parents=True, exist_ok=True)

          SERVER_LOG = WORK / "server.log"
          TUNNEL_LOG = WORK / "tunnel.log"

          server = None
          tunnel = None

          def log(message):
              timestamp = datetime.now().strftime("%H:%M:%S")
              print(f"[{timestamp}] {message}", flush=True)

          def start_process(command, log_path):
              with open(
                  log_path,
                  "a",
                  encoding="utf-8",
                  errors="replace"
              ) as output:
                  return subprocess.Popen(
                      command,
                      stdout=output,
                      stderr=subprocess.STDOUT,
                      creationflags=subprocess.CREATE_NO_WINDOW
                  )

          def port_is_open():
              try:
                  with socket.create_connection(
                      (HOST, PORT),
                      timeout=3
                  ):
                      return True
              except OSError:
                  return False

          def wait_for_server(timeout=120):
              deadline = time.time() + timeout

              while time.time() < deadline:
                  if port_is_open():
                      return True
                  time.sleep(2)

              return False

          def configure():
              settings = [
                  ["service", "set", "hostname", HOST],
                  ["service", "set", "port", str(PORT)],
                  ["service", "set", "password", PASSWORD],
              ]

              for setting in settings:
                  subprocess.run(
                      [str(LARPCODE), *setting],
                      check=True,
                      timeout=60
                  )

          def start_server():
              global server

              if port_is_open():
                  log("LarpCode is already ONLINE.")
                  return

              log("Starting LarpCode...")

              server = start_process(
                  [str(LARPCODE), "serve", "--service"],
                  SERVER_LOG
              )

              if not wait_for_server():
                  raise RuntimeError(
                      "LarpCode failed to start on port 3000"
                  )

              log("LarpCode is ONLINE.")

          def start_tunnel():
              global tunnel

              log("Starting Cloudflare Quick Tunnel...")

              tunnel = start_process(
                  [
                      str(CLOUDFLARED),
                      "tunnel",
                      "--url",
                      f"http://{HOST}:{PORT}",
                      "--no-autoupdate"
                  ],
                  TUNNEL_LOG
              )

              deadline = time.time() + 120

              while time.time() < deadline:
                  if tunnel.poll() is not None:
                      raise RuntimeError(
                          "Cloudflare Tunnel exited unexpectedly"
                      )

                  try:
                      content = TUNNEL_LOG.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )

                      match = re.search(
                          r"https://[a-zA-Z0-9-]+\.trycloudflare\.com",
                          content
                      )

                      if match:
                          return match.group(0)

                  except OSError:
                      pass

                  time.sleep(2)

              raise RuntimeError(
                  "Could not obtain Cloudflare Tunnel URL"
              )

          def stop_process(process):
              if process is None:
                  return

              try:
                  subprocess.run(
                      [
                          "taskkill",
                          "/PID",
                          str(process.pid),
                          "/T",
                          "/F"
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=15
                  )
              except Exception:
                  pass

          try:
              log("Configuring LarpCode...")
              configure()

              start_server()

              tunnel_url = start_tunnel()

              log("=" * 55)
              log("LARPCODE PUBLIC URL")
              log(tunnel_url)
              log("=" * 55)

              log("Pairing is disabled.")
              log("Hosting duration: 355 minutes.")

              deadline = time.time() + DURATION

              while time.time() < deadline:

                  if not port_is_open():
                      log("LarpCode is not responding.")
                      start_server()

                  if tunnel is None or tunnel.poll() is not None:
                      log("Cloudflare Tunnel disconnected.")

                      tunnel_url = start_tunnel()

                      log("=" * 55)
                      log("NEW LARPCODE PUBLIC URL")
                      log(tunnel_url)
                      log("=" * 55)

                  remaining = max(
                      0,
                      int((deadline - time.time()) / 60)
                  )

                  log(
                      f"LarpCode: ONLINE | "
                      f"Cloudflare: ONLINE | "
                      f"Remaining: {remaining} minutes"
                  )

                  time.sleep(60)

              log("355-minute hosting completed.")

          except Exception as error:
              log(f"FATAL ERROR: {error}")
              raise

          finally:
              log("Stopping processes...")
              stop_process(tunnel)
              stop_process(server)
              log("Cleanup completed.")

          '@ | Set-Content -Path "$env:RUNNER_TEMP\main.py" -Encoding UTF8

          python -u "$env:RUNNER_TEMP\main.py"
