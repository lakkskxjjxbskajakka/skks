
name: OpenCode Web (Secure)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '60'
      opencode_port:
        description: 'پورت داخلی OpenCode Web'
        required: true
        default: '4096'
      proxy_port:
        description: 'پورت پروکسی امن (Caddy)'
        required: true
        default: '8443'

permissions:
  contents: write

concurrency:
  group: opencode-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencode-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OPENCODE_BASIC_USER: admin
      OPENCODE_BASIC_PASS: admin
      PROXY_SERVER_KEY: local-test-key
      PROXY_WEBUI_USER: admin
      PROXY_WEBUI_PASS: changeme-changeme
      WARP_POOL_SIZE: '8'
      OPENCODE_PORT: ${{ github.event.inputs.opencode_port }}
      PROXY_PORT: ${{ github.event.inputs.proxy_port }}
      CADDY_VERSION: '2.8.4'

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: تنظیم Git identity + مسیرهای امن
        run: |
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

          LOG_DIR="${RUNNER_TEMP:-/tmp}/opencode-logs"
          mkdir -p "$LOG_DIR"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"

          CONFIG_ROOT="${RUNNER_TEMP:-/tmp}/opencode-config"
          mkdir -p "$CONFIG_ROOT/opencode"
          echo "XDG_CONFIG_HOME=$CONFIG_ROOT" >> "$GITHUB_ENV"

          printf '\n# === OpenCode runner artifacts (auto) ===\n*.log\nopencode-url.txt\n.opencode/\nopencode.json\n.env\n.env.*\n' >> .gitignore

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب OpenCode
        run: |
          npm install -g opencode-ai@latest || npm install -g opencode@latest
          opencode --version || true

      - name: نصب Caddy
        run: |
          set -euo pipefail

          ARCH="amd64"
          URL="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_${ARCH}.tar.gz"

          echo "Downloading Caddy: $URL"

          curl -fsSL "$URL" -o /tmp/caddy.tar.gz
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy

          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy

          rm -f /tmp/caddy /tmp/caddy.tar.gz

          caddy version

      - name: راه‌اندازی opencode-unlimited-proxy (WARP)
        run: |
          set -euo pipefail

          echo "📥 دریافت مخزن پروکسی..."

          git clone https://github.com/ebouther/opencode-unlimited-proxy.git /tmp/opencode-unlimited-proxy

          cd /tmp/opencode-unlimited-proxy/stack

          cat > .env <<EOF
          WARP_ACCEPT_TOS=1
          WARP_SOURCE_IPV6=
          OPENCODE2API_SERVER_KEYS=${PROXY_SERVER_KEY}
          WEBUI_USERNAME=${PROXY_WEBUI_USER}
          WEBUI_PASSWORD=${PROXY_WEBUI_PASS}
          WARP_POOL_SIZE=${WARP_POOL_SIZE}
          EOF

          echo "🧹 پاکسازی محیط قبلی..."

          docker compose down -v --remove-orphans 2>/dev/null || true
          docker rm -f ofu-engine stack-config-init-1 2>/dev/null || true

          echo "🐳 اجرای Docker Compose..."

          docker compose up -d

          echo "⏳ انتظار برای آماده شدن WARP..."

          READY=0

          for i in $(seq 1 60); do

            if curl -sf --max-time 3 http://127.0.0.1:8080/healthz > /tmp/healthz.json 2>/dev/null; then

              WARP_STATUS=$(python3 -c "import json;print(json.load(open('/tmp/healthz.json')).get('warp',{}).get('status',''))" 2>/dev/null || echo "")

              ACTIVE=$(python3 -c "import json;print(json.load(open('/tmp/healthz.json')).get('warp',{}).get('active',0))" 2>/dev/null || echo "0")

              echo "[$i/60] warp.status=$WARP_STATUS active=$ACTIVE"

              if [ "$WARP_STATUS" = "ready" ]; then
                echo "✅ WARP آماده است"
                READY=1
                break
              fi

            else
              echo "[$i/60] healthz هنوز پاسخ نمی‌دهد"
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo "----- Docker logs -----"
              docker compose logs --tail=30 opencode-engine 2>&1 || true
            fi

            sleep 5
          done

          echo "----- وضعیت نهایی Health -----"

          curl -s --max-time 5 http://127.0.0.1:8080/healthz | python3 -m json.tool || true

          if [ "$READY" != "1" ]; then

            echo "❌ WARP آماده نشد"

            docker compose ps -a || true
            docker compose logs --tail=200 2>&1 || true

            exit 1
          fi

      - name: ساخت کانفیگ OpenCode (همه مدل‌ها)
        run: |
          set -euo pipefail

          CONFIG_FILE="$XDG_CONFIG_HOME/opencode/opencode.json"

          PASS_HASH=$(caddy hash-password --plaintext "$OPENCODE_BASIC_PASS")
          echo "CADDY_PASS_HASH=$PASS_HASH" >> "$GITHUB_ENV"

          echo "📋 دریافت مدل‌ها..."

          curl -sf --max-time 15 \
            -H "Authorization: Bearer ${PROXY_SERVER_KEY}" \
            http://127.0.0.1:8080/v1/models > /tmp/models.json || {
              echo "❌ دریافت مدل‌ها شکست خورد"
              exit 1
            }

          python3 - "$CONFIG_FILE" "$PROXY_SERVER_KEY" /tmp/models.json <<'PY'
          import json
          import sys

          out_path, api_key, models_path = sys.argv[1:4]

          try:
              raw = json.load(open(models_path))
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)

          if isinstance(raw, list):
              items = raw
          elif isinstance(raw, dict) and isinstance(raw.get("data"), list):
              items = raw["data"]
          elif isinstance(raw, dict) and isinstance(raw.get("models"), list):
              items = raw["models"]
          else:
              print("Unknown models response format")
              sys.exit(1)

          model_ids = []

          for item in items:
              if isinstance(item, dict):
                  mid = item.get("id") or item.get("name") or item.get("model")
              else:
                  mid = str(item)

              if mid:
                  model_ids.append(str(mid).strip())

          seen = set()

          model_ids = [
              m for m in model_ids
              if not (m in seen or seen.add(m))
          ]

          if not model_ids:
              model_ids = ["beam-free"]

          models = {
              mid: {"name": mid}
              for mid in model_ids
          }

          config = {
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                  "opencode-unlimited-proxy": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "OpenCode Unlimited Proxy (WARP)",
                      "options": {
                          "baseURL": "http://127.0.0.1:8080/v1",
                          "apiKey": api_key
                      },
                      "models": models
                  }
              },
              "model": f"opencode-unlimited-proxy/{model_ids[0]}",
              "autoupdate": False,
              "share": "disabled"
          }

          json.dump(
              config,
              open(out_path, "w"),
              ensure_ascii=False,
              indent=2
          )

          print(f"Models: {len(models)}")
          print(f"Default: {config['model']}")
          PY

          chmod 600 "$CONFIG_FILE"

      - name: اجرای OpenCode Web
        run: |
          set -euo pipefail

          nohup opencode web \
            --port "$OPENCODE_PORT" \
            --hostname 127.0.0.1 \
            > "$LOG_DIR/opencode.log" 2>&1 &

          echo "OPENCODE_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do

            CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 2 \
              "http://127.0.0.1:$OPENCODE_PORT" || true)

            if echo "$CODE" | grep -qE '200|30[0-9]|40[0-9]'; then
              echo "✅ OpenCode ready: HTTP $CODE"
              break
            fi

            echo "Waiting ($i/30): $CODE"
            sleep 2
          done

          tail -n 40 "$LOG_DIR/opencode.log" || true

      - name: راه‌اندازی Caddy
        run: |
          set -euo pipefail

          CADDY_DIR="${RUNNER_TEMP:-/tmp}/caddy"
          mkdir -p "$CADDY_DIR"

          cat > "$CADDY_DIR/Caddyfile" <<'CADDYEOF'
          {
            admin off
            auto_https off
          }

          :__PROXY_PORT__ {
            encode zstd gzip

            basic_auth {
              __BASIC_USER__ __BASIC_HASH__
            }

            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Content-Type-Options "nosniff"
              X-Frame-Options "DENY"
              Referrer-Policy "no-referrer"
              -Server
            }

            reverse_proxy 127.0.0.1:__OPENCODE_PORT__ {
              header_up Host {host}
              header_up X-Real-IP {remote_host}
            }
          }
          CADDYEOF

          python3 - "$CADDY_DIR/Caddyfile" <<'PY'
          import sys
          import os

          p = sys.argv[1]
          s = open(p).read()

          s = s.replace("__PROXY_PORT__", os.environ["PROXY_PORT"])
          s = s.replace("__OPENCODE_PORT__", os.environ["OPENCODE_PORT"])
          s = s.replace("__BASIC_USER__", os.environ["OPENCODE_BASIC_USER"])
          s = s.replace("__BASIC_HASH__", os.environ["CADDY_PASS_HASH"])

          open(p, "w").write(s)
          PY

          caddy validate \
            --config "$CADDY_DIR/Caddyfile" \
            --adapter caddyfile

          nohup caddy run \
            --config "$CADDY_DIR/Caddyfile" \
            --adapter caddyfile \
            > "$LOG_DIR/caddy.log" 2>&1 &

          echo "CADDY_PID=$!" >> "$GITHUB_ENV"

          sleep 5

          tail -n 30 "$LOG_DIR/caddy.log" || true

          NOAUTH=$(curl -sS -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:${PROXY_PORT}/" || true)

          echo "Without authentication: HTTP $NOAUTH"

          if [ "$NOAUTH" != "401" ]; then
            echo "❌ Basic Auth failed"
            exit 1
          fi

          AUTH=$(curl -sS -o /dev/null -w "%{http_code}" \
            -u "${OPENCODE_BASIC_USER}:${OPENCODE_BASIC_PASS}" \
            "http://127.0.0.1:${PROXY_PORT}/" || true)

          echo "With authentication: HTTP $AUTH"

          if [ "$AUTH" = "401" ]; then
            echo "❌ Authentication rejected"
            exit 1
          fi

          echo "✅ Basic Auth enabled"

      - name: راه‌اندازی تونل Cloudflare
        run: |
          set -euo pipefail

          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url "http://127.0.0.1:${PROXY_PORT}" \
            --no-autoupdate \
            > "$LOG_DIR/cloudflare.log" 2>&1 &

          echo "CLOUDFLARED_PID=$!" >> "$GITHUB_ENV"

          sleep 8

          TUNNEL_URL=$(grep -oP \
            'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
            "$LOG_DIR/cloudflare.log" | head -n1 || true)

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Tunnel failed"
            cat "$LOG_DIR/cloudflare.log"
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo "$TUNNEL_URL" > opencode-url.txt

          echo "✅ Tunnel: $TUNNEL_URL"

      - name: نمایش خلاصه
        run: |
          MODEL_COUNT=$(python3 -c \
            "import json;c=json.load(open('$XDG_CONFIG_HOME/opencode/opencode.json'));print(len(c['provider']['opencode-unlimited-proxy']['models']))" \
            2>/dev/null || echo "?")

          {
            echo "## OpenCode Web (Secure) 🔐"
            echo ""
            echo "- **URL:** ${TUNNEL_URL}"
            echo "- **Username:** \`${OPENCODE_BASIC_USER}\`"
            echo "- **Proxy:** opencode-unlimited-proxy"
            echo "- **WARP Pool Size:** \`${WARP_POOL_SIZE}\`"
            echo "- **Models:** \`${MODEL_COUNT}\`"
            echo "- **Duration:** ${{ github.event.inputs.duration }} minutes"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================================================
      # ADVANCED WATCHDOG
      # ==================================================

      - name: نگهبانی هوشمند + گزارش کامل تشخیصی
        run: |
          set -uo pipefail

          DURATION="${{ github.event.inputs.duration }}"
          END_TIME=$(date -d "$DURATION minutes" +%s)

          TUNNEL_URL="${TUNNEL_URL}"
          CADDY_CFG="${RUNNER_TEMP:-/tmp}/caddy/Caddyfile"
          STACK_DIR="/tmp/opencode-unlimited-proxy/stack"

          DIAG_DIR="$LOG_DIR/diagnostics"
          mkdir -p "$DIAG_DIR"

          ITERATION=0

          # ------------------------------------------
          # Logging
          # ------------------------------------------

          log() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
          }

          section() {
            echo ""
            echo "=================================================="
            echo " $*"
            echo "=================================================="
          }

          # ------------------------------------------
          # Safe HTTP check
          # ------------------------------------------

          http_check() {
            local URL="$1"
            local OUTPUT="$2"

            local CODE

            CODE=$(curl -sS \
              --connect-timeout 5 \
              --max-time 15 \
              -o "$OUTPUT" \
              -w "%{http_code}" \
              "$URL" 2>"${OUTPUT}.error") || true

            CODE="${CODE:-000}"

            echo "$CODE"
          }

          # ------------------------------------------
          # Diagnostic report
          # ------------------------------------------

          diagnostic_report() {

            local REASON="$1"
            local REPORT="$DIAG_DIR/diagnostic-$(date +%Y%m%d-%H%M%S).log"

            section "FULL DIAGNOSTIC REPORT"

            log "Reason: $REASON"
            log "Report: $REPORT"

            {

              echo "========================================"
              echo "OpenCode Watchdog Diagnostic"
              echo "========================================"

              date -Is

              echo ""
              echo "Reason: $REASON"

              # --------------------------------------
              # System
              # --------------------------------------

              echo ""
              echo "========== SYSTEM =========="

              uname -a
              uptime
              free -h
              df -h
              df -i

              # --------------------------------------
              # Processes
              # --------------------------------------

              echo ""
              echo "========== PROCESSES =========="

              ps auxww

              # --------------------------------------
              # Ports
              # --------------------------------------

              echo ""
              echo "========== LISTENING PORTS =========="

              ss -lntp || true

              # --------------------------------------
              # Docker
              # --------------------------------------

              echo ""
              echo "========== DOCKER STATUS =========="

              docker ps -a --no-trunc || true

              echo ""
              echo "========== DOCKER COMPOSE PS =========="

              (
                cd "$STACK_DIR" &&
                docker compose ps -a
              ) 2>&1 || true

              echo ""
              echo "========== DOCKER EVENTS =========="

              docker events --since 5m --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --filter type=container 2>&1 | tail -n 100 || true

              # --------------------------------------
              # Container logs
              # --------------------------------------

              echo ""
              echo "========== OPENCODE ENGINE LOGS =========="

              (
                cd "$STACK_DIR" &&
                docker compose logs --timestamps --tail=150 opencode-engine
              ) 2>&1 || true

              echo ""
              echo "========== CONFIG INIT LOGS =========="

              (
                cd "$STACK_DIR" &&
                docker compose logs --timestamps --tail=100 2>&1
              ) || true

              # --------------------------------------
              # Health check
              # --------------------------------------

              echo ""
              echo "========== PROXY HEALTHZ =========="

              curl -sS \
                --connect-timeout 5 \
                --max-time 10 \
                -i http://127.0.0.1:8080/healthz 2>&1 || true

              echo ""
              echo "========== MODELS API =========="

              curl -sS \
                --connect-timeout 5 \
                --max-time 10 \
                -o /dev/null \
                -w "HTTP: %{http_code}\n" \
                http://127.0.0.1:8080/v1/models 2>&1 || true

              # --------------------------------------
              # OpenCode
              # --------------------------------------

              echo ""
              echo "========== OPENCODE LOGS =========="

              tail -n 150 "$LOG_DIR/opencode.log" 2>&1 || true

              echo ""
              echo "========== OPENCODE PROCESS =========="

              pgrep -af opencode || true

              # --------------------------------------
              # Caddy
              # --------------------------------------

              echo ""
              echo "========== CADDY LOGS =========="

              tail -n 150 "$LOG_DIR/caddy.log" 2>&1 || true

              echo ""
              echo "========== CADDY PROCESS =========="

              pgrep -af caddy || true

              # --------------------------------------
              # Cloudflare
              # --------------------------------------

              echo ""
              echo "========== CLOUDFLARED LOGS =========="

              tail -n 150 "$LOG_DIR/cloudflare.log" 2>&1 || true

              echo ""
              echo "========== CLOUDFLARED PROCESS =========="

              pgrep -af cloudflared || true

              # --------------------------------------
              # Network
              # --------------------------------------

              echo ""
              echo "========== NETWORK =========="

              ip addr 2>&1 || true
              ip route 2>&1 || true

              echo ""
              echo "========== DNS =========="

              cat /etc/resolv.conf 2>&1 || true

              echo ""
              echo "========== CONNECTIVITY =========="

              curl -sS -I --connect-timeout 5 \
                https://github.com 2>&1 || true

              echo ""
              echo "========== END REPORT =========="

            } > "$REPORT" 2>&1

            cat "$REPORT"

            log "Diagnostic report saved: $REPORT"
          }

          # ------------------------------------------
          # Service status
          # ------------------------------------------

          check_services() {

            local FAILED=0

            section "SERVICE HEALTH CHECK"

            # Proxy

            PROXY_CODE=$(http_check \
              "http://127.0.0.1:8080/healthz" \
              "/tmp/watchdog-proxy-health.json")

            log "Proxy health: HTTP $PROXY_CODE"

            if [ "$PROXY_CODE" != "200" ]; then
              log "❌ Proxy health check failed"
              FAILED=1
            fi

            # OpenCode

            OC_CODE=$(http_check \
              "http://127.0.0.1:${OPENCODE_PORT}/" \
              "/tmp/watchdog-opencode.html")

            log "OpenCode: HTTP $OC_CODE"

            if [ "$OC_CODE" = "000" ]; then
              log "❌ OpenCode is unreachable"
              FAILED=1
            fi

            # Caddy

            CAD_CODE=$(http_check \
              "http://127.0.0.1:${PROXY_PORT}/" \
              "/tmp/watchdog-caddy.html")

            log "Caddy: HTTP $CAD_CODE"

            if [ "$CAD_CODE" != "401" ]; then
              log "❌ Caddy authentication check failed"
              FAILED=1
            fi

            # Cloudflare

            TUNNEL_CODE=$(http_check \
              "$TUNNEL_URL" \
              "/tmp/watchdog-cloudflare.html")

            log "Cloudflare: HTTP $TUNNEL_CODE"

            if [ "$TUNNEL_CODE" = "000" ] ||
               [ "$TUNNEL_CODE" = "502" ] ||
               [ "$TUNNEL_CODE" = "530" ]; then

              log "❌ Cloudflare tunnel unreachable"
              FAILED=1
            fi

            return "$FAILED"
          }

          # ------------------------------------------
          # Restart functions
          # ------------------------------------------

          restart_proxy() {

            section "RESTART PROXY"

            (
              cd "$STACK_DIR" &&
              docker compose restart
            ) || true

            log "Waiting for proxy..."

            for i in $(seq 1 30); do

              CODE=$(http_check \
                "http://127.0.0.1:8080/healthz" \
                "/tmp/watchdog-restart-proxy.json")

              if [ "$CODE" = "200" ]; then
                log "✅ Proxy recovered"
                return 0
              fi

              log "Proxy recovery: $i/30 HTTP $CODE"

              sleep 5
            done

            log "❌ Proxy recovery failed"

            diagnostic_report "PROXY RESTART FAILED"

            return 1
          }

          restart_opencode() {

            section "RESTART OPENCODE"

            pkill -f '[o]pencode web' || true

            sleep 2

            nohup opencode web \
              --port "$OPENCODE_PORT" \
              --hostname 127.0.0.1 \
              > "$LOG_DIR/opencode.log" 2>&1 &

            log "New OpenCode PID: $!"

            sleep 5

            CODE=$(http_check \
              "http://127.0.0.1:${OPENCODE_PORT}/" \
              "/tmp/watchdog-opencode-restart.html")

            log "OpenCode after restart: HTTP $CODE"

            if [ "$CODE" = "000" ]; then
              diagnostic_report "OPENCODE RESTART FAILED"
              return 1
            fi

            return 0
          }

          restart_caddy() {

            section "RESTART CADDY"

            pkill -x caddy || true

            sleep 2

            caddy validate \
              --config "$CADDY_CFG" \
              --adapter caddyfile || {
                log "❌ Caddy configuration invalid"
                return 1
              }

            nohup caddy run \
              --config "$CADDY_CFG" \
              --adapter caddyfile \
              > "$LOG_DIR/caddy.log" 2>&1 &

            log "New Caddy PID: $!"

            sleep 5

            CODE=$(http_check \
              "http://127.0.0.1:${PROXY_PORT}/" \
              "/tmp/watchdog-caddy-restart.html")

            log "Caddy after restart: HTTP $CODE"

            if [ "$CODE" != "401" ]; then
              diagnostic_report "CADDY RESTART FAILED"
              return 1
            fi

            return 0
          }

          restart_tunnel() {

            section "RESTART CLOUDFLARE TUNNEL"

            pkill -x cloudflared || true

            sleep 2

            nohup ./cloudflared tunnel \
              --url "http://127.0.0.1:${PROXY_PORT}" \
              --no-autoupdate \
              > "$LOG_DIR/cloudflare.log" 2>&1 &

            log "New Cloudflare PID: $!"

            sleep 10

            NEW_URL=$(grep -oP \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_DIR/cloudflare.log" | head -n1 || true)

            if [ -n "$NEW_URL" ]; then

              TUNNEL_URL="$NEW_URL"

              echo "$NEW_URL" > opencode-url.txt

              echo "TUNNEL_URL=$NEW_URL" >> "$GITHUB_ENV"

              log "✅ New tunnel: $NEW_URL"

              return 0
            fi

            log "❌ Failed to create new tunnel"

            diagnostic_report "CLOUDFLARE RESTART FAILED"

            return 1
          }

          # ------------------------------------------
          # Initial report
          # ------------------------------------------

          section "WATCHDOG STARTED"

          log "Duration: $DURATION minutes"
          log "OpenCode port: $OPENCODE_PORT"
          log "Proxy port: $PROXY_PORT"
          log "Tunnel: $TUNNEL_URL"

          diagnostic_report "INITIAL SYSTEM SNAPSHOT"

          # ------------------------------------------
          # Main loop
          # ------------------------------------------

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            ITERATION=$((ITERATION + 1))

            REMAINING=$((END_TIME - $(date +%s)))

            section "WATCHDOG CYCLE #$ITERATION"

            log "Remaining: $((REMAINING / 60))m $((REMAINING % 60))s"

            # Docker status

            log "Docker container status:"

            docker ps -a \
              --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true

            # WARP status

            if [ -f /tmp/watchdog-proxy-health.json ]; then

              log "WARP health response:"

              python3 -m json.tool \
                /tmp/watchdog-proxy-health.json 2>/dev/null || \
                cat /tmp/watchdog-proxy-health.json

            fi

            # Run checks

            FAILED=0

            if ! check_services; then
              FAILED=1
            fi

            # --------------------------------------
            # Detailed diagnostics on failure
            # --------------------------------------

            if [ "$FAILED" = "1" ]; then

              log "⚠️ One or more services failed"

              diagnostic_report "SERVICE HEALTH CHECK FAILURE"

              # Proxy recovery

              PROXY_CODE=$(http_check \
                "http://127.0.0.1:8080/healthz" \
                "/tmp/watchdog-proxy-recheck.json")

              if [ "$PROXY_CODE" != "200" ]; then
                restart_proxy || true
              fi

              sleep 5

              # OpenCode recovery

              OC_CODE=$(http_check \
                "http://127.0.0.1:${OPENCODE_PORT}/" \
                "/tmp/watchdog-opencode-recheck.html")

              if [ "$OC_CODE" = "000" ]; then
                restart_opencode || true
              fi

              sleep 3

              # Caddy recovery

              CAD_CODE=$(http_check \
                "http://127.0.0.1:${PROXY_PORT}/" \
                "/tmp/watchdog-caddy-recheck.html")

              if [ "$CAD_CODE" != "401" ]; then
                restart_caddy || true
              fi

              sleep 3

              # Tunnel recovery

              TUNNEL_CODE=$(http_check \
                "$TUNNEL_URL" \
                "/tmp/watchdog-tunnel-recheck.html")

              if [ "$TUNNEL_CODE" = "000" ] ||
                 [ "$TUNNEL_CODE" = "502" ] ||
                 [ "$TUNNEL_CODE" = "530" ]; then

                restart_tunnel || true

              fi

              # Final diagnostics

              diagnostic_report "POST RECOVERY STATUS"

            else

              log "✅ All services are responding normally"

            fi

            # --------------------------------------
            # Periodic log snapshots
            # --------------------------------------

            if [ $((ITERATION % 10)) -eq 0 ]; then

              section "PERIODIC LOG SNAPSHOT"

              log "OpenCode:"
              tail -n 20 "$LOG_DIR/opencode.log" || true

              log "Caddy:"
              tail -n 20 "$LOG_DIR/caddy.log" || true

              log "Cloudflare:"
              tail -n 20 "$LOG_DIR/cloudflare.log" || true

              log "Docker:"
              (
                cd "$STACK_DIR" &&
                docker compose logs --tail=30
              ) 2>&1 || true

            fi

            sleep 30

          done

          # ------------------------------------------
          # Final report
          # ------------------------------------------

          section "WATCHDOG FINISHED"

          log "Execution duration completed"

          diagnostic_report "FINAL SYSTEM SNAPSHOT"

          log "All watchdog diagnostics saved in: $DIAG_DIR"

      - name: آپلود آرتیفکت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-secure-info
          path: |
            ${{ env.LOG_DIR }}/*.log
            ${{ env.LOG_DIR }}/diagnostics/*.log
            opencode-url.txt
            /tmp/models.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit و push اجباری
        if: always()
        run: |
          set -uo pipefail

          git add -A

          if git diff --cached -U0 | grep -aiE '(api[_-]?key|secret|token|password|Bearer)[=:" ]+[A-Za-z0-9_\-]{16,}'; then
            echo "❌ الگوی مشکوک به Secret پیدا شد"
            git reset
            exit 1
          fi

          if git diff --cached --name-only | grep -aiE '(^|/)(\.env|opencode\.json|.*\.log)$|\.opencode/'; then
            echo "❌ فایل حساس در staging"
            git reset
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "ℹ️ تغییری برای commit وجود ندارد"
            exit 0
          fi

          git commit -m "chore(opencode): auto-commit at $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          for attempt in 1 2 3; do

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ Push موفق"
              exit 0
            fi

            echo "⚠️ Push ناموفق، تلاش $attempt"

            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true

            sleep 3

          done

          echo "❌ Push در ۳ تلاش ناموفق بود"
          exit 1
