
name: OpenCode Unlimited Web (V2)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '355'
      opencode_port:
        description: 'پورت OpenCode'
        required: true
        default: '4096'

permissions:
  contents: read

concurrency:
  group: opencode-unlimited-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencode-unlimited:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OPENCODE_PORT: ${{ inputs.opencode_port }}
      DURATION: ${{ inputs.duration }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCode V2
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @opencode/cli

          hash -r

          opencode --version

      - name: Clone and Install OpenCode Unlimited
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME"

          git clone \
            https://github.com/Tazmyan/OpenCode-Unlimited.git

          cd "$HOME/OpenCode-Unlimited"

          chmod +x install.sh
          chmod +x bin/opencode-unlimited

          bash install.sh

          # Load the installed PATH configuration
          touch "$HOME/.bashrc"
          source "$HOME/.bashrc"

          # Explicit PATH for GitHub Actions
          echo "$HOME/OpenCode-Unlimited/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/OpenCode-Unlimited/bin:$PATH"

          hash -r

          opencode-unlimited --help || true

          echo "UNLIMITED_HOME=$HOME/OpenCode-Unlimited" >> "$GITHUB_ENV"

      - name: First Plugin Initialization
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          cd "$HOME"

          echo "Initializing OpenCode Unlimited plugin..."

          opencode-unlimited plugin

      - name: OpenCode Initial Serve and Shutdown
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/opencode-logs"

          echo "Starting initial OpenCode serve..."

          opencode serve \
            --port "$OPENCODE_PORT" \
            --hostname 127.0.0.1 \
            > "$RUNNER_TEMP/opencode-logs/initial.log" 2>&1 &

          INITIAL_PID=$!

          READY=0

          for i in $(seq 1 45); do
            CODE=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 2 \
              "http://127.0.0.1:${OPENCODE_PORT}/" || true)

            if [[ "$CODE" =~ ^(200|30[0-9]|401|403|404|426)$ ]]; then
              echo "OpenCode initial serve ready: HTTP $CODE"
              READY=1
              break
            fi

            sleep 2
          done

          # Equivalent to Ctrl+C
          if kill -0 "$INITIAL_PID" 2>/dev/null; then
            kill -INT "$INITIAL_PID" || true
            wait "$INITIAL_PID" || true
          fi

          if [ "$READY" -ne 1 ]; then
            echo "Initial OpenCode startup failed."
            cat "$RUNNER_TEMP/opencode-logs/initial.log"
            exit 1
          fi

          echo "Initial OpenCode process stopped successfully."

      - name: Second Plugin Initialization
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          opencode-unlimited plugin

      - name: Start OpenCode Unlimited Serve
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          LOG_DIR="$RUNNER_TEMP/opencode-logs"
          mkdir -p "$LOG_DIR"
          chmod 700 "$LOG_DIR"

          echo "Starting OpenCode Unlimited serve..."

          nohup opencode-unlimited run serve \
            --port "$OPENCODE_PORT" \
            --hostname 127.0.0.1 \
            > "$LOG_DIR/opencode.log" 2>&1 < /dev/null &

          SERVER_PID=$!

          echo "$SERVER_PID" > "$RUNNER_TEMP/opencode.pid"

          READY=0

          for i in $(seq 1 45); do
            CODE=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 2 \
              "http://127.0.0.1:${OPENCODE_PORT}/" || true)

            if [[ "$CODE" =~ ^(200|30[0-9]|401|403|404|426)$ ]]; then
              echo "OpenCode is ready: HTTP $CODE"
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat "$LOG_DIR/opencode.log"
            exit 1
          fi

          echo "OPENCODE_PID=$SERVER_PID" >> "$GITHUB_ENV"

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          LOG_DIR="$RUNNER_TEMP/opencode-logs"

          nohup "$RUNNER_TEMP/cloudflared" tunnel \
            --url "http://127.0.0.1:${OPENCODE_PORT}" \
            --no-autoupdate \
            > "$LOG_DIR/cloudflare.log" 2>&1 < /dev/null &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > "$RUNNER_TEMP/cloudflared.pid"

          TUNNEL_URL=""

          for i in $(seq 1 40); do
            TUNNEL_URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_DIR/cloudflare.log" | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            cat "$LOG_DIR/cloudflare.log"
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo "Cloudflare tunnel ready: $TUNNEL_URL"

          echo "$TUNNEL_URL" > "$RUNNER_TEMP/opencode-url.txt"

      - name: OpenCode Unlimited Pair
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          echo "Creating OpenCode pairing link..."

          opencode-unlimited run \
            --server "http://127.0.0.1:${OPENCODE_PORT}" \
            pair \
            --url "$TUNNEL_URL"

      - name: Session Summary
        shell: bash
        run: |
          {
            echo "## OpenCode Unlimited V2"
            echo ""
            echo "- **OpenCode:** V2"
            echo "- **Tunnel:** $TUNNEL_URL"
            echo "- **Port:** $OPENCODE_PORT"
            echo "- **Duration:** $DURATION minutes"
            echo "- **Status:** Active"
            echo ""
            echo "### Startup sequence"
            echo "1. npm install -g @opencode/cli"
            echo "2. Clone OpenCode-Unlimited"
            echo "3. bash install.sh"
            echo "4. Initial plugin initialization"
            echo "5. Initial serve and shutdown"
            echo "6. Second plugin initialization"
            echo "7. opencode-unlimited run serve"
            echo "8. Cloudflare Tunnel"
            echo "9. opencode-unlimited run pair"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Service Watchdog
        shell: bash
        run: |
          set -uo pipefail

          END_TIME=$(( $(date +%s) + DURATION * 60 ))

          LOG_DIR="$RUNNER_TEMP/opencode-logs"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            REMAINING=$((END_TIME - $(date +%s)))

            echo "Remaining: $((REMAINING / 60))m $((REMAINING % 60))s"

            # OpenCode health
            CODE=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 5 \
              "http://127.0.0.1:${OPENCODE_PORT}/" || true)

            if [[ ! "$CODE" =~ ^(200|30[0-9]|401|403|404|426)$ ]]; then

              echo "OpenCode unavailable. Restarting..."

              if [ -f "$RUNNER_TEMP/opencode.pid" ]; then
                kill "$(cat "$RUNNER_TEMP/opencode.pid")" 2>/dev/null || true
              fi

              nohup opencode-unlimited run serve \
                --port "$OPENCODE_PORT" \
                --hostname 127.0.0.1 \
                >> "$LOG_DIR/opencode.log" 2>&1 < /dev/null &

              echo "$!" > "$RUNNER_TEMP/opencode.pid"

              sleep 8
            fi

            # Cloudflare process health
            if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then
              CF_PID=$(cat "$RUNNER_TEMP/cloudflared.pid")

              if ! kill -0 "$CF_PID" 2>/dev/null; then
                echo "Cloudflare process stopped."

                nohup "$RUNNER_TEMP/cloudflared" tunnel \
                  --url "http://127.0.0.1:${OPENCODE_PORT}" \
                  --no-autoupdate \
                  > "$LOG_DIR/cloudflare.log" 2>&1 < /dev/null &

                echo "$!" > "$RUNNER_TEMP/cloudflared.pid"

                sleep 10

                NEW_URL=$(grep -oE \
                  'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                  "$LOG_DIR/cloudflare.log" | head -n 1 || true)

                if [ -n "$NEW_URL" ]; then
                  echo "New tunnel: $NEW_URL"

                  echo "$NEW_URL" > "$RUNNER_TEMP/opencode-url.txt"

                  # Generate a new one-time pairing link
                  opencode-unlimited run \
                    --server "http://127.0.0.1:${OPENCODE_PORT}" \
                    pair \
                    --url "$NEW_URL" || true
                fi
              fi
            fi

            sleep 30

          done

          echo "Session duration completed."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "Stopping services..."

          if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null
          fi

          if [ -f "$RUNNER_TEMP/opencode.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/opencode.pid")" 2>/dev/null
          fi

          pkill -f "opencode-unlimited.*run serve" 2>/dev/null || true

          echo "Cleanup completed."
