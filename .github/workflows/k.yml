
name: OpenCode Unlimited Web (V2)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '355'
      opencode_port:
        description: 'پورت OpenCode'
        required: true
        default: '4096'

permissions:
  contents: read

concurrency:
  group: opencode-unlimited-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencode-unlimited:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OPENCODE_PORT: ${{ inputs.opencode_port }}
      DURATION: ${{ inputs.duration }}
      OPENCODE_PASSWORD: "oc123"

    steps:

      # -----------------------------------------------
      # 1. Checkout
      # -----------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------
      # 2. Node.js
      # -----------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # -----------------------------------------------
      # 3. Install OpenCode V2
      # -----------------------------------------------

      - name: Install OpenCode V2
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @opencode/cli

          hash -r

          opencode --version

      # -----------------------------------------------
      # 4. Clone and install Unlimited
      # -----------------------------------------------

      - name: Install OpenCode Unlimited
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME"

          git clone \
            https://github.com/Tazmyan/OpenCode-Unlimited.git

          cd "$HOME/OpenCode-Unlimited"

          chmod +x install.sh
          chmod +x bin/opencode-unlimited

          bash install.sh

          touch "$HOME/.bashrc"
          source "$HOME/.bashrc"

          export PATH="$HOME/OpenCode-Unlimited/bin:$PATH"

          echo "$HOME/OpenCode-Unlimited/bin" >> "$GITHUB_PATH"

          echo "UNLIMITED_HOME=$HOME/OpenCode-Unlimited" >> "$GITHUB_ENV"

          hash -r

          opencode-unlimited --help || true

      # -----------------------------------------------
      # 5. First Plugin Initialization
      # -----------------------------------------------

      - name: First Plugin Initialization
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          opencode-unlimited plugin

      # -----------------------------------------------
      # 6. Initial OpenCode Serve
      # -----------------------------------------------

      - name: Initial OpenCode Serve
        shell: bash
        run: |
          set -euo pipefail

          LOG_DIR="$RUNNER_TEMP/opencode-logs"

          mkdir -p "$LOG_DIR"

          echo "Starting initial OpenCode server..."

          nohup opencode serve \
            --port "$OPENCODE_PORT" \
            --hostname 127.0.0.1 \
            > "$LOG_DIR/initial.log" 2>&1 < /dev/null &

          INITIAL_PID=$!

          READY=0

          for i in $(seq 1 45); do

            CODE=$(curl -s \
              -u "opencode:${OPENCODE_PASSWORD}" \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 2 \
              "http://127.0.0.1:${OPENCODE_PORT}/" || true)

            if [[ "$CODE" =~ ^(200|30[0-9]|403|404|426)$ ]]; then
              echo "OpenCode ready: HTTP $CODE"
              READY=1
              break
            fi

            sleep 2
          done

          # Equivalent to Ctrl+C
          kill -INT "$INITIAL_PID" 2>/dev/null || true

          wait "$INITIAL_PID" || true

          if [ "$READY" -ne 1 ]; then
            echo "Initial server failed."
            cat "$LOG_DIR/initial.log"
            exit 1
          fi

          echo "Initial server stopped."

      # -----------------------------------------------
      # 7. Second Plugin Initialization
      # -----------------------------------------------

      - name: Second Plugin Initialization
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          opencode-unlimited plugin

      # -----------------------------------------------
      # 8. Start OpenCode Unlimited Serve
      # -----------------------------------------------

      - name: Start OpenCode Unlimited Serve
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          LOG_DIR="$RUNNER_TEMP/opencode-logs"

          mkdir -p "$LOG_DIR"

          echo "Starting OpenCode Unlimited serve..."

          nohup opencode-unlimited run serve \
            --port "$OPENCODE_PORT" \
            --hostname 127.0.0.1 \
            > "$LOG_DIR/opencode.log" 2>&1 < /dev/null &

          SERVER_PID=$!

          echo "$SERVER_PID" > "$RUNNER_TEMP/opencode.pid"

          READY=0

          for i in $(seq 1 45); do

            CODE=$(curl -s \
              -u "opencode:${OPENCODE_PASSWORD}" \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 2 \
              "http://127.0.0.1:${OPENCODE_PORT}/" || true)

            if [[ "$CODE" =~ ^(200|30[0-9]|403|404|426)$ ]]; then
              echo "OpenCode ready: HTTP $CODE"
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat "$LOG_DIR/opencode.log"
            exit 1
          fi

          echo "OPENCODE_PID=$SERVER_PID" >> "$GITHUB_ENV"

      # -----------------------------------------------
      # 9. Cloudflare Tunnel
      # -----------------------------------------------

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          LOG_DIR="$RUNNER_TEMP/opencode-logs"

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          nohup "$RUNNER_TEMP/cloudflared" tunnel \
            --url "http://127.0.0.1:${OPENCODE_PORT}" \
            --no-autoupdate \
            > "$LOG_DIR/cloudflare.log" 2>&1 < /dev/null &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > "$RUNNER_TEMP/cloudflared.pid"

          TUNNEL_URL=""

          for i in $(seq 1 40); do

            TUNNEL_URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_DIR/cloudflare.log" | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Cloudflare tunnel creation failed."
            cat "$LOG_DIR/cloudflare.log"
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo "$TUNNEL_URL" > "$RUNNER_TEMP/opencode-url.txt"

          echo "Cloudflare URL: $TUNNEL_URL"

      # -----------------------------------------------
      # 10. OpenCode Unlimited Pair
      # -----------------------------------------------

      - name: OpenCode Unlimited Pair
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$UNLIMITED_HOME/bin:$PATH"

          echo "Creating OpenCode pairing link..."

          opencode-unlimited run pair \
            --url "$TUNNEL_URL"

      # -----------------------------------------------
      # 11. Session Summary
      # -----------------------------------------------

      - name: Session Summary
        shell: bash
        run: |
          {
            echo "# OpenCode Unlimited Web V2"
            echo ""
            echo "- **OpenCode:** V2"
            echo "- **Tunnel:** $TUNNEL_URL"
            echo "- **Port:** $OPENCODE_PORT"
            echo "- **Authentication:** Enabled"
            echo "- **Username:** opencode"
            echo "- **Password:** Configured"
            echo "- **Duration:** $DURATION minutes"
            echo "- **Status:** Active"
            echo ""
            echo "## Startup sequence"
            echo "1. Install @opencode/cli"
            echo "2. Clone OpenCode-Unlimited"
            echo "3. Run install.sh"
            echo "4. First plugin initialization"
            echo "5. Initial OpenCode serve"
            echo "6. Stop initial server"
            echo "7. Second plugin initialization"
            echo "8. OpenCode Unlimited serve"
            echo "9. Cloudflare Tunnel"
            echo "10. OpenCode Unlimited Pair"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------
      # 12. Watchdog
      # -----------------------------------------------

      - name: Service Watchdog
        shell: bash
        run: |
          set -euo pipefail

          END_TIME=$(( $(date +%s) + DURATION * 60 ))

          LOG_DIR="$RUNNER_TEMP/opencode-logs"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            REMAINING=$((END_TIME - $(date +%s)))

            echo "Remaining: $((REMAINING / 60))m $((REMAINING % 60))s"

            # ---------------------------------------
            # OpenCode health
            # ---------------------------------------

            CODE=$(curl -s \
              -u "opencode:${OPENCODE_PASSWORD}" \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 5 \
              "http://127.0.0.1:${OPENCODE_PORT}/" || true)

            if [[ ! "$CODE" =~ ^(200|30[0-9]|403|404|426)$ ]]; then

              echo "OpenCode unavailable. Restarting..."

              if [ -f "$RUNNER_TEMP/opencode.pid" ]; then
                kill "$(cat "$RUNNER_TEMP/opencode.pid")" 2>/dev/null || true
              fi

              nohup opencode-unlimited run serve \
                --port "$OPENCODE_PORT" \
                --hostname 127.0.0.1 \
                >> "$LOG_DIR/opencode.log" 2>&1 < /dev/null &

              echo "$!" > "$RUNNER_TEMP/opencode.pid"

              sleep 10

            fi

            # ---------------------------------------
            # Cloudflare health
            # ---------------------------------------

            CF_PID=$(cat "$RUNNER_TEMP/cloudflared.pid" 2>/dev/null || echo "")

            TUNNEL_CODE=$(curl -s \
              -u "opencode:${OPENCODE_PASSWORD}" \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 5 \
              "$TUNNEL_URL/" || true)

            if [[ -z "$CF_PID" ]] || \
               ! kill -0 "$CF_PID" 2>/dev/null || \
               [[ "$TUNNEL_CODE" == "000" ]] || \
               [[ "$TUNNEL_CODE" == "502" ]] || \
               [[ "$TUNNEL_CODE" == "530" ]]; then

              echo "Cloudflare tunnel unavailable. Rebuilding..."

              if [ -n "$CF_PID" ]; then
                kill "$CF_PID" 2>/dev/null || true
              fi

              sleep 2

              nohup "$RUNNER_TEMP/cloudflared" tunnel \
                --url "http://127.0.0.1:${OPENCODE_PORT}" \
                --no-autoupdate \
                > "$LOG_DIR/cloudflare.log" 2>&1 < /dev/null &

              NEW_PID=$!

              echo "$NEW_PID" > "$RUNNER_TEMP/cloudflared.pid"

              NEW_URL=""

              for i in $(seq 1 30); do

                NEW_URL=$(grep -oE \
                  'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                  "$LOG_DIR/cloudflare.log" | head -n 1 || true)

                if [ -n "$NEW_URL" ]; then
                  break
                fi

                sleep 2
              done

              if [ -n "$NEW_URL" ]; then

                TUNNEL_URL="$NEW_URL"

                echo "$NEW_URL" > "$RUNNER_TEMP/opencode-url.txt"

                echo "New tunnel: $NEW_URL"

                # Generate new pairing link
                opencode-unlimited run pair \
                  --url "$NEW_URL" || true

              else
                echo "Failed to rebuild Cloudflare tunnel."
              fi

            fi

            sleep 30

          done

          echo "Session duration completed."

      # -----------------------------------------------
      # 13. Cleanup
      # -----------------------------------------------

      - name: Cleanup Services
        if: always()
        shell: bash
        run: |
          set +e

          echo "Cleaning up..."

          for PID_FILE in \
            "$RUNNER_TEMP/cloudflared.pid" \
            "$RUNNER_TEMP/opencode.pid"; do

            if [ -f "$PID_FILE" ]; then
              kill "$(cat "$PID_FILE")" 2>/dev/null || true
            fi

          done

          echo "Cleanup completed."

      # -----------------------------------------------
      # 14. Upload logs and URL
      # -----------------------------------------------

      - name: Upload Session Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-unlimited-info
          path: |
            ${{ runner.temp }}/opencode-logs/*.log
            ${{ runner.temp }}/opencode-url.txt
          if-no-files-found: ignore
