
name: OpenCode Web (Secure)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '60'
      opencode_port:
        description: 'پورت داخلی OpenCode Web'
        required: true
        default: '4096'
      proxy_port:
        description: 'پورت پروکسی امن (Caddy)'
        required: true
        default: '8443'

permissions:
  contents: write

concurrency:
  group: opencode-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencode-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
      OPENCODE_BASIC_PASS: ${{ secrets.OPENCODE_BASIC_PASS }}
      OPENCODE_PORT: ${{ github.event.inputs.opencode_port }}
      PROXY_PORT: ${{ github.event.inputs.proxy_port }}
      CADDY_VERSION: '2.8.4'

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: تنظیم Git identity + مسیرهای امن
        run: |
          set -euo pipefail

          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

          LOG_DIR="${RUNNER_TEMP:-/tmp}/opencode-logs"
          mkdir -p "$LOG_DIR"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"

          CONFIG_ROOT="${RUNNER_TEMP:-/tmp}/opencode-config"
          mkdir -p "$CONFIG_ROOT/opencode"
          echo "XDG_CONFIG_HOME=$CONFIG_ROOT" >> "$GITHUB_ENV"

          printf '\n# === OpenCode runner artifacts (auto) ===\n*.log\nopencode-url.txt\n.opencode/\nopencode.json\nfree_tool_models_report.json\n.env\n.env.*\n' >> .gitignore

      # ─────────────────────────────────────────────
      # ساخت اسکریپت مرکزی Commit & Push
      # ─────────────────────────────────────────────

      - name: ساخت اسکریپت اجباری Git Sync
        run: |
          set -euo pipefail

          SYNC_SCRIPT="$RUNNER_TEMP/git-force-sync.sh"

          cat > "$SYNC_SCRIPT" <<'SYNC_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          MAX_ATTEMPTS=3

          echo ""
          echo "========================================"
          echo "  FORCE GIT COMMIT & PUSH"
          echo "  Branch: $BRANCH"
          echo "  Time: $(date -u)"
          echo "========================================"

          # دریافت تمام تغییرات
          git add -A

          # بررسی احتمال وجود Secret
          if git diff --cached -U0 | grep -aiE \
            '(api[_-]?key|secret|token|password|Bearer)[=:" ]+[A-Za-z0-9_\-]{16,}'; then

            echo "ERROR: Suspicious secret detected!"
            git reset
            return_code=1
            exit "$return_code"
          fi

          # جلوگیری از Commit فایل‌های حساس
          if git diff --cached --name-only | grep -aiE \
            '(^|/)(\.env|opencode\.json|.*\.log|free_tool_models_report\.json)$|\.opencode/'; then

            echo "ERROR: Sensitive file detected!"
            git reset
            exit 1
          fi

          # ثبت تغییرات؛ حتی در صورت نبود تغییر جدید
          echo "Creating commit..."

          git commit --allow-empty \
            -m "chore(opencode): periodic sync $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || {
              echo "ERROR: Commit failed"
              return_code=1
              exit "$return_code"
            }

          # تلاش برای Push
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            echo ""
            echo "Push attempt: $attempt/$MAX_ATTEMPTS"

            if git push origin "HEAD:${BRANCH}"; then
              echo "SUCCESS: Commit pushed!"
              return_code=0
              exit "$return_code"
            fi

            echo "Push failed. Fetching remote changes..."

            if ! git fetch origin "$BRANCH"; then
              echo "Fetch failed."
              sleep 3
              continue
            fi

            echo "Rebasing..."

            if ! git rebase "origin/${BRANCH}"; then
              echo "Rebase conflict!"
              git rebase --abort || true
              sleep 3
              continue
            fi

            sleep 3
          done

          echo "ERROR: All push attempts failed."
          exit 1
          SYNC_EOF

          chmod +x "$SYNC_SCRIPT"

          echo "GIT_SYNC_SCRIPT=$SYNC_SCRIPT" >> "$GITHUB_ENV"

          echo "Git sync script created."

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب OpenCode
        run: |
          npm install -g opencode-ai@latest || npm install -g opencode@latest
          opencode --version || true

      - name: نصب Caddy
        run: |
          set -euo pipefail

          ARCH="amd64"
          URL="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_${ARCH}.tar.gz"

          curl -fsSL "$URL" -o /tmp/caddy.tar.gz
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy

          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy

          rm -f /tmp/caddy /tmp/caddy.tar.gz

          caddy version

      - name: نصب وابستگی‌های پایتون
        run: |
          python3 -m pip install --quiet --disable-pip-version-check requests

      # ─────────────────────────────────────────────
      # کشف مدل‌ها
      # ─────────────────────────────────────────────

      - name: کشف و تست مدل‌های رایگان با Δ=0
        id: discover
        continue-on-error: true
        run: |
          set -uo pipefail

          REPORT="$RUNNER_TEMP/free_tool_models_report.json"

          python3 - "$REPORT" <<'PYEOF'
          import json
          import os
          import sys
          import time
          import requests

          BASE = "https://gen.pollinations.ai"
          MODELS_URL = f"{BASE}/text/models"
          CHAT_URL = f"{BASE}/v1/chat/completions"
          BALANCE_URL = f"{BASE}/account/balance"

          API_KEY = os.environ.get("POLLINATIONS_API_KEY", "")

          if not API_KEY:
              sys.exit("POLLINATIONS_API_KEY not set")

          HEADERS = {
              "Authorization": f"Bearer {API_KEY}",
              "Content-Type": "application/json",
          }

          TIMEOUT = 9
          RETRIES = 2
          MAX_TOKENS = 512
          SLEEP_BETWEEN = 1.2

          TEST_MESSAGES = [
              {
                  "role": "user",
                  "content": "Reply with exactly one word: what color is the sky on a clear day?"
              }
          ]

          TEST_TOOLS = [{
              "type": "function",
              "function": {
                  "name": "ping",
                  "description": "Trivial echo tool for testing native tool calling.",
                  "parameters": {
                      "type": "object",
                      "properties": {
                          "value": {"type": "string"}
                      },
                      "required": ["value"],
                  },
              },
          }]

          def fetch_models():
              r = requests.get(MODELS_URL, headers=HEADERS, timeout=30)
              r.raise_for_status()

              data = r.json()

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in ("data", "models", "items"):
                      if isinstance(data.get(key), list):
                          return data[key]

              raise RuntimeError("Unexpected response shape")

          def has_no_pricing_numbers(pricing):
              if not isinstance(pricing, dict):
                  return False

              numeric_keys = [k for k in pricing if k != "currency"]
              return len(numeric_keys) == 0

          def has_tool_calling(model):
              caps = model.get("capabilities") or []

              if "tool_calling" in caps:
                  return True

              return bool(model.get("tools"))

          def filter_free_with_tools(models):
              out = []

              for m in models:
                  if not has_no_pricing_numbers(m.get("pricing")):
                      continue

                  if not has_tool_calling(m):
                      continue

                  out.append({
                      "id": m.get("name"),
                      "title": m.get("title") or m.get("name"),
                      "publisher": m.get("publisher") or m.get("brand"),
                      "community": bool(m.get("community")),
                      "supports_streaming": m.get("supports_streaming", True),
                  })

              out.sort(key=lambda x: (x["community"], x["id"]))
              return out

          def get_balance():
              try:
                  r = requests.get(BALANCE_URL, headers=HEADERS, timeout=20)

                  if r.status_code != 200:
                      return {"error": f"HTTP {r.status_code}"}

                  return r.json()

              except requests.RequestException as e:
                  return {"error": str(e)}

          def balance_number(b):
              if not isinstance(b, dict) or "error" in b:
                  return None

              if isinstance(b.get("accountBalance"), dict):
                  v = b["accountBalance"].get("total")

                  if isinstance(v, (int, float)):
                      return float(v)

              v = b.get("balance")

              return float(v) if isinstance(v, (int, float)) else None

          def parse_stream(resp):
              content_parts = []
              tool_names = []

              for raw in resp.iter_lines(decode_unicode=True):
                  if not raw:
                      continue

                  line = raw.strip()

                  if not line.startswith("data:"):
                      continue

                  payload = line[5:].strip()

                  if payload == "[DONE]":
                      break

                  try:
                      chunk = json.loads(payload)
                  except Exception:
                      continue

                  choices = chunk.get("choices") or []

                  if not choices:
                      continue

                  delta = choices[0].get("delta") or {}

                  if delta.get("content"):
                      content_parts.append(delta["content"])

                  for tc in delta.get("tool_calls") or []:
                      name = (tc.get("function") or {}).get("name")

                      if name:
                          tool_names.append(name)

              return "".join(content_parts).strip(), tool_names

          def call_model(model_id, use_stream):
              payload = {
                  "model": model_id,
                  "messages": TEST_MESSAGES,
                  "max_tokens": MAX_TOKENS,
                  "temperature": 0,
                  "tools": TEST_TOOLS,
                  "tool_choice": "auto",
                  "stream": use_stream,
              }

              last_err = None

              for attempt in range(RETRIES + 1):
                  try:
                      r = requests.post(
                          CHAT_URL,
                          headers=HEADERS,
                          data=json.dumps(payload),
                          timeout=TIMEOUT,
                          stream=use_stream,
                      )

                      if r.status_code >= 400:
                          try:
                              body = r.json()
                              msg = (
                                  (body.get("error", {}) or {}).get("message")
                                  or r.text
                              )
                          except Exception:
                              msg = r.text

                          low = msg.lower()

                          if not use_stream and (
                              "stream:true" in low
                              or "stream: true" in low
                              or "stream:false is not supported" in low
                          ):
                              use_stream = True
                              payload["stream"] = True
                              continue

                          return False, f"HTTP {r.status_code}: {msg[:200]}", use_stream

                      if use_stream:
                          content, tool_names = parse_stream(r)

                          if tool_names:
                              return True, f"tool_calls={tool_names}", use_stream

                          if not content:
                              return False, "stream returned empty", use_stream

                          return True, f"content={content[:120]!r}", use_stream

                      data = r.json()

                      msg = (
                          (data.get("choices") or [{}])[0].get("message") or {}
                      )

                      content = (msg.get("content") or "").strip()
                      tool_calls = msg.get("tool_calls") or []

                      if tool_calls:
                          names = [
                              tc.get("function", {}).get("name", "?")
                              for tc in tool_calls
                          ]

                          return True, f"tool_calls={names}", use_stream

                      return True, f"content={content[:120]!r}", use_stream

                  except requests.Timeout:
                      last_err = "timeout"

                  except requests.RequestException as e:
                      last_err = str(e)

                  if attempt < RETRIES:
                      time.sleep(2 * (attempt + 1))

              return False, f"failed: {last_err}", use_stream

          out_path = sys.argv[1]

          try:
              all_models = fetch_models()

          except Exception as e:
              print(f"خطا در دریافت لیست: {e}")

              with open(out_path, "w") as f:
                  json.dump({
                      "free_ok": [],
                      "details": [],
                      "error": str(e)
                  }, f)

              sys.exit(0)

          candidates = filter_free_with_tools(all_models)

          print(f"کل مدل‌ها: {len(all_models)}")
          print(f"کاندیدها: {len(candidates)}")

          b0 = get_balance()
          n0 = balance_number(b0)

          print(f"موجودی اولیه: {n0}")

          results = []

          for i, c in enumerate(candidates, 1):
              mid = c["id"]

              print(f"[{i}/{len(candidates)}] {mid}")

              ok, detail, used_stream = call_model(
                  mid,
                  bool(c.get("supports_streaming", True))
              )

              print(f"{'SUCCESS' if ok else 'FAILED'}: {detail}")

              n = balance_number(get_balance())

              delta = (
                  n - n0
                  if n0 is not None and n is not None
                  else None
              )

              print(f"Δ={delta}")

              results.append({
                  "model": mid,
                  "title": c["title"],
                  "community": c["community"],
                  "stream": used_stream,
                  "ok": ok,
                  "detail": detail,
                  "delta": delta,
              })

              time.sleep(SLEEP_BETWEEN)

          free_ok = [
              r["model"]
              for r in results
              if r["ok"]
              and r["delta"] is not None
              and abs(r["delta"]) < 1e-9
          ]

          paid_ok = [
              r["model"]
              for r in results
              if r["ok"]
              and (
                  r["delta"] is None
                  or abs(r["delta"]) >= 1e-9
              )
          ]

          failed = [
              r["model"]
              for r in results
              if not r["ok"]
          ]

          print("FREE:", free_ok)
          print("PAID:", paid_ok)
          print("FAILED:", failed)

          report = {
              "initial_balance": n0,
              "final_balance": balance_number(get_balance()),
              "free_ok": free_ok,
              "paid_ok": paid_ok,
              "failed": failed,
              "details": results,
          }

          with open(out_path, "w") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          PYEOF

          if [ ! -f "$REPORT" ]; then
            echo "FREE_MODELS_JSON=[]" >> "$GITHUB_ENV"
            exit 0
          fi

          FREE_JSON=$(python3 - "$REPORT" <<'PY'
          import json, sys

          with open(sys.argv[1]) as f:
              d = json.load(f)

          print(json.dumps(d.get("free_ok", [])))
          PY
          )

          echo "FREE_MODELS_JSON=$FREE_JSON" >> "$GITHUB_ENV"

          echo "مدل‌های رایگان: $FREE_JSON"

      # ─────────────────────────────────────────────
      # ساخت کانفیگ OpenCode
      # ─────────────────────────────────────────────

      - name: ساخت کانفیگ OpenCode
        run: |
          set -euo pipefail

          CONFIG_FILE="$XDG_CONFIG_HOME/opencode/opencode.json"

          PASS_HASH=$(caddy hash-password --plaintext "$OPENCODE_BASIC_PASS")

          echo "CADDY_PASS_HASH=$PASS_HASH" >> "$GITHUB_ENV"

          FREE_MODELS="${FREE_MODELS_JSON:-[]}"

          python3 - "$CONFIG_FILE" "$POLLINATIONS_API_KEY" "$FREE_MODELS" <<'PY'
          import json
          import sys

          out_path, api_key, free_models_json = sys.argv[1:4]

          try:
              free_models = json.loads(free_models_json)

              if not isinstance(free_models, list):
                  free_models = []

          except Exception:
              free_models = []

          models = {
              "stealth/glyph-cluster": {
                  "name": "stealth/glyph-cluster"
              }
          }

          for mid in free_models:
              if isinstance(mid, str) and mid and mid not in models:
                  models[mid] = {"name": mid}

          if "stealth/glyph-cluster" in free_models:
              default_model = "pollinations/stealth/glyph-cluster"

          elif free_models:
              default_model = f"pollinations/{free_models[0]}"

          else:
              default_model = "pollinations/stealth/glyph-cluster"

          config = {
              "$schema": "https://opencode.ai/config.json",

              "provider": {
                  "pollinations": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "Pollinations (OpenAI-compatible)",

                      "options": {
                          "baseURL": "https://gen.pollinations.ai/v1",
                          "apiKey": api_key,
                      },

                      "models": models,
                  }
              },

              "model": default_model,
              "autoupdate": False,
              "share": "disabled",
          }

          with open(out_path, "w") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          print(f"مدل‌های کانفیگ: {len(models)}")
          print(f"مدل پیش‌فرض: {default_model}")
          PY

          chmod 600 "$CONFIG_FILE"

      - name: اجرای OpenCode Web
        run: |
          set -euo pipefail

          nohup opencode web \
            --port "$OPENCODE_PORT" \
            --hostname 127.0.0.1 \
            > "$LOG_DIR/opencode.log" 2>&1 &

          echo "OPENCODE_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do

            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 2 \
              "http://127.0.0.1:$OPENCODE_PORT" || echo "000")

            if echo "$CODE" | grep -qE '200|30[0-9]|40[0-9]'; then
              echo "OpenCode آماده است: HTTP $CODE"
              break
            fi

            echo "انتظار... ($i/30)"
            sleep 2
          done

          tail -n 40 "$LOG_DIR/opencode.log" || true

      # ─────────────────────────────────────────────
      # Caddy
      # ─────────────────────────────────────────────

      - name: راه‌اندازی Caddy
        run: |
          set -euo pipefail

          CADDY_DIR="$RUNNER_TEMP/caddy"
          mkdir -p "$CADDY_DIR"

          cat > "$CADDY_DIR/Caddyfile" <<'CADDYEOF'
          {
            admin off
            auto_https off
          }

          :__PROXY_PORT__ {
            encode zstd gzip

            basic_auth {
              __BASIC_USER__ __BASIC_HASH__
            }

            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Content-Type-Options "nosniff"
              X-Frame-Options "DENY"
              Referrer-Policy "no-referrer"
              -Server
            }

            reverse_proxy 127.0.0.1:__OPENCODE_PORT__ {
              header_up Host {host}
              header_up X-Real-IP {remote_host}
            }
          }
          CADDYEOF

          python3 - "$CADDY_DIR/Caddyfile" <<'PY'
          import sys
          import os

          p = sys.argv[1]

          with open(p) as f:
              s = f.read()

          s = s.replace("__PROXY_PORT__", os.environ["PROXY_PORT"])
          s = s.replace("__OPENCODE_PORT__", os.environ["OPENCODE_PORT"])
          s = s.replace("__BASIC_USER__", os.environ["OPENCODE_BASIC_USER"])
          s = s.replace("__BASIC_HASH__", os.environ["CADDY_PASS_HASH"])

          with open(p, "w") as f:
              f.write(s)
          PY

          caddy validate \
            --config "$CADDY_DIR/Caddyfile" \
            --adapter caddyfile

          nohup caddy run \
            --config "$CADDY_DIR/Caddyfile" \
            --adapter caddyfile \
            > "$LOG_DIR/caddy.log" 2>&1 &

          echo "CADDY_PID=$!" >> "$GITHUB_ENV"

          sleep 5

          tail -n 30 "$LOG_DIR/caddy.log" || true

          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:${PROXY_PORT}/" || echo "000")

          echo "بدون رمز: HTTP $NOAUTH"

          if [ "$NOAUTH" != "401" ]; then
            echo "Basic Auth کار نمی‌کند"
            exit 1
          fi

          AUTH=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${OPENCODE_BASIC_USER}:${OPENCODE_BASIC_PASS}" \
            "http://127.0.0.1:${PROXY_PORT}/" || echo "000")

          echo "با رمز: HTTP $AUTH"

          if [ "$AUTH" = "401" ] || [ "$AUTH" = "000" ]; then
            echo "احراز هویت ناموفق است"
            exit 1
          fi

          echo "Basic Auth فعال است"

      # ─────────────────────────────────────────────
      # Cloudflare Tunnel
      # ─────────────────────────────────────────────

      - name: راه‌اندازی تونل Cloudflare
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url "http://127.0.0.1:${PROXY_PORT}" \
            --no-autoupdate \
            > "$LOG_DIR/cloudflare.log" 2>&1 &

          echo "CLOUDFLARED_PID=$!" >> "$GITHUB_ENV"

          sleep 8

          TUNNEL_URL=$(grep -oP \
            'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
            "$LOG_DIR/cloudflare.log" | head -n1 || true)

          if [ -z "$TUNNEL_URL" ]; then
            echo "ساخت تونل ناموفق بود"
            cat "$LOG_DIR/cloudflare.log"
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo "$TUNNEL_URL" > opencode-url.txt

          echo "تونل آماده است: $TUNNEL_URL"

      # ─────────────────────────────────────────────
      # خلاصه
      # ─────────────────────────────────────────────

      - name: نمایش خلاصه
        run: |
          {
            echo "## OpenCode Web (Secure) 🔐"
            echo ""
            echo "- **URL:** $TUNNEL_URL"
            echo "- **Username:** (از GitHub Secrets)"
            echo "- **Password:** (از GitHub Secrets)"
            echo "- **Free models:** ${FREE_MODELS_JSON:-[]}"
            echo "- **Duration:** ${{ github.event.inputs.duration }} minutes"
            echo "- **Git Sync:** Every 14 minutes"
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────
      # نگهبان سرویس‌ها + Git Sync هر ۱۴ دقیقه
      # ─────────────────────────────────────────────

      - name: نگهبانی سرویس‌ها و Commit & Push دوره‌ای
        run: |
          set -uo pipefail

          DURATION="${{ github.event.inputs.duration }}"

          END_TIME=$(date -d "$DURATION minutes" +%s)

          TUNNEL_URL="${TUNNEL_URL}"

          CADDY_CFG="$RUNNER_TEMP/caddy/Caddyfile"

          # اولین Sync پس از ۱۴ دقیقه
          NEXT_SYNC=$(($(date +%s) + 840))

          echo "========================================"
          echo "Service Watchdog Started"
          echo "Git Sync Interval: 14 minutes"
          echo "========================================"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            NOW=$(date +%s)

            REMAINING=$((END_TIME - NOW))

            echo ""
            echo "[$(date +%H:%M:%S)]"
            echo "Remaining: $((REMAINING/60))m $((REMAINING%60))s"

            # ─────────────────────────────
            # سرویس OpenCode
            # ─────────────────────────────

            OC=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              "http://127.0.0.1:${OPENCODE_PORT}" || echo "000")

            if [ "$OC" = "000" ]; then

              echo "OpenCode unavailable - restarting"

              pkill -f "opencode web" || true

              sleep 2

              nohup opencode web \
                --port "$OPENCODE_PORT" \
                --hostname 127.0.0.1 \
                > "$LOG_DIR/opencode.log" 2>&1 &

              sleep 5
            fi

            # ─────────────────────────────
            # سرویس Caddy
            # ─────────────────────────────

            CAD=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://127.0.0.1:${PROXY_PORT}/" || echo "000")

            if [ "$CAD" != "401" ]; then

              echo "Caddy unavailable - restarting"

              pkill -f caddy || true

              sleep 2

              nohup caddy run \
                --config "$CADDY_CFG" \
                --adapter caddyfile \
                > "$LOG_DIR/caddy.log" 2>&1 &

              sleep 5
            fi

            # ─────────────────────────────
            # Cloudflare Tunnel
            # ─────────────────────────────

            T=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              "$TUNNEL_URL" || echo "000")

            if [ "$T" = "000" ] || [ "$T" = "502" ] || [ "$T" = "530" ]; then

              echo "Cloudflare tunnel unavailable - rebuilding"

              pkill -f cloudflared || true

              sleep 2

              nohup ./cloudflared tunnel \
                --url "http://127.0.0.1:${PROXY_PORT}" \
                --no-autoupdate \
                > "$LOG_DIR/cloudflare.log" 2>&1 &

              sleep 8

              NEW=$(grep -oP \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                "$LOG_DIR/cloudflare.log" | head -n1 || true)

              if [ -n "$NEW" ]; then

                TUNNEL_URL="$NEW"

                echo "$NEW" > opencode-url.txt

                echo "New tunnel: $NEW"
              fi
            fi

            # ─────────────────────────────
            # اجباری: Git Commit & Push
            # ─────────────────────────────

            NOW=$(date +%s)

            if [ "$NOW" -ge "$NEXT_SYNC" ]; then

              echo ""
              echo "========================================"
              echo "14-MINUTE GIT SYNC TRIGGERED"
              echo "========================================"

              if "$GIT_SYNC_SCRIPT"; then

                echo "Git Sync SUCCESS"

                # زمان‌بندی ۱۴ دقیقه بعد از پایان Sync موفق
                NEXT_SYNC=$(($(date +%s) + 840))

              else

                echo "Git Sync FAILED"

                # تلاش مجدد پس از ۶۰ ثانیه
                NEXT_SYNC=$(($(date +%s) + 60))

              fi

              echo "Next Git Sync: $(date -d "@$NEXT_SYNC" '+%H:%M:%S')"
            fi

            sleep 10

          done

          echo ""
          echo "Watchdog finished."
          echo "Final Git Sync will run now."

      # ─────────────────────────────────────────────
      # آپلود آرتیفکت
      # ─────────────────────────────────────────────

      - name: آپلود آرتیفکت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-secure-info
          path: |
            ${{ env.LOG_DIR }}/*.log
            opencode-url.txt
            ${{ runner.temp }}/free_tool_models_report.json
          if-no-files-found: ignore

      # ─────────────────────────────────────────────
      # Commit & Push نهایی
      # ─────────────────────────────────────────────

      - name: Final Force Commit & Push
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "FINAL GIT COMMIT & PUSH"
          echo "========================================"

          if [ ! -f "$GIT_SYNC_SCRIPT" ]; then
            echo "Git sync script not found!"
            exit 1
          fi

          "$GIT_SYNC_SCRIPT"

          RESULT=$?

          if [ "$RESULT" -eq 0 ]; then
            echo "Final Git Sync successful."
          else
            echo "Final Git Sync failed."
            exit "$RESULT"
          fi
